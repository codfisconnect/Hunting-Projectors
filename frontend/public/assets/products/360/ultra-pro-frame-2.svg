<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette / Glow -->
    <radialGradient id="stageGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#141822" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0B0D12" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Graphite Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242833"/>
      <stop offset="25%" stop-color="#181B22"/>
      <stop offset="70%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#0C0E12"/>
    </linearGradient>

    <!-- Top Plate Anodized Aluminum -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A404F"/>
      <stop offset="10%" stop-color="#222631"/>
      <stop offset="90%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>

    <!-- Optical Lens Gradients -->
    <radialGradient id="lensGlass" cx="50.74025148547635%" cy="35.76120467488713%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#9DDCFF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#4C9EEB" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#061226" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Lens Specular Glint -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9DDCFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow / Ambient Occlusion -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="400" cy="300" r="320" fill="url(#stageGlow)"/>

  <!-- Optical Projection Beam (Subtle) -->
  
  <polygon points="421,210 501,210 838.2683432365089,-50 838.2683432365089,100" fill="#9DDCFF" opacity="0.07"/>
  

  <!-- Contact Shadow beneath Projector -->
  <ellipse cx="400" cy="485" rx="256.9551813004515" ry="38.8268343236509" fill="url(#floorShadow)"/>

  <!-- Projector Main Chassis Group -->
  <g transform="translate(400, 300) skewY(1.1480502970952695)">
    
    <!-- Base Chassis Shadow Edge -->
    <rect x="-265" y="-80" width="530" height="180" rx="28" fill="#08090C" opacity="0.8"/>

    <!-- Main Chassis Body -->
    <rect x="-270" y="-90" width="540" height="180" rx="28" fill="url(#chassisGrad)" stroke="#2D323E" stroke-width="1.5"/>

    <!-- Top Bevel Highlight Edge -->
    <path d="M -242 -90 L 242 -90 Q 270 -90 270 -73.2" fill="none" stroke="#5A6376" stroke-width="1.5" opacity="0.8"/>

    <!-- Horizontal Acoustic Ventilation Grille -->
    <g opacity="0.45">
      
        <line x1="-230" y1="-30" x2="230" y2="-30" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-29" x2="230" y2="-29" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="-8" x2="230" y2="-8" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-7" x2="230" y2="-7" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="14" x2="230" y2="14" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="15" x2="230" y2="15" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="36" x2="230" y2="36" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="37" x2="230" y2="37" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="58" x2="230" y2="58" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="59" x2="230" y2="59" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="80" x2="230" y2="80" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="81" x2="230" y2="81" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="102" x2="230" y2="102" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="103" x2="230" y2="103" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="124" x2="230" y2="124" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="125" x2="230" y2="125" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
    </g>

    <!-- Front Optical Lens Assembly (Only visible when facing toward front) -->
    
    <!-- Lens Outer Barrel Ring -->
    <g transform="translate(61, -20)">
      <!-- Shadow behind lens housing -->
      <ellipse cx="0" cy="0" rx="81.9712589748939" ry="88" fill="#0A0B0E" opacity="0.9"/>
      
      <!-- Outer Machined Bezel with Knurled Texture -->
      <ellipse cx="0" cy="0" rx="78.24529265785327" ry="84" fill="#1A1C22" stroke="#485062" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="70.79336002377201" ry="76" fill="#101217" stroke="#222631" stroke-width="1.5"/>

      <!-- Precision Optical Glass Element -->
      <ellipse cx="0" cy="0" rx="63.34142738969074" ry="68" fill="url(#lensGlass)"/>

      <!-- Anti-Reflective Internal Coating Rings -->
      <ellipse cx="-4.65745789630079" cy="-5" rx="48.43756212152822" ry="52" fill="none" stroke="#9DDCFF" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="4.65745789630079" cy="6" rx="33.53369685336569" ry="36" fill="none" stroke="#4C9EEB" stroke-width="1.2" opacity="0.7"/>

      <!-- Specular Optical Reflection Arc -->
      <path d="M -37.25966317040632 -42 A 54.02651159708917 58 0 0 1 27.94474737780474 -48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-20.492814743723475" cy="-22" r="5" fill="#FFFFFF" opacity="0.9"/>

      <!-- ToF Laser Sensor Window -->
      <circle cx="65.20441054821106" cy="-35" r="7" fill="#0C0E14" stroke="#373D4D" stroke-width="1.5"/>
      <circle cx="65.20441054821106" cy="-35" r="3" fill="#9DDCFF" opacity="0.8"/>
    </g>
    

    <!-- Laser Etched Hunting Brand Emblem -->
    <g transform="translate(0, 50)" opacity="0.85">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#E2E5EB" letter-spacing="5" text-anchor="middle">HUNTING</text>
      <text x="0" y="14" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="600" fill="#757E90" letter-spacing="4" text-anchor="middle">PROJECTORS</text>
    </g>

    <!-- Status Indicator LED Strip -->
    <rect x="-35" y="76" width="70" height="2.5" rx="1" fill="#9DDCFF" opacity="0.85"/>

    <!-- Corner Anodized Fasteners -->
    <circle cx="-250" cy="-70" r="2.5" fill="#444B5B"/>
    <circle cx="250" cy="-70" r="2.5" fill="#444B5B"/>
    <circle cx="-250" cy="70" r="2.5" fill="#444B5B"/>
    <circle cx="250" cy="70" r="2.5" fill="#444B5B"/>

  </g>

  <!-- Technical Spec Metadata Stamp (Architectural & Premium) -->
  <g transform="translate(50, 560)">
    <text x="0" y="0" font-family="Inter, monospace" font-size="9" fill="#525B6C" letter-spacing="2">MODEL: HUNTING-ULTRA-PRO • DEGREE: 22.5°</text>
    <text x="700" y="0" font-family="Inter, monospace" font-size="9" fill="#525B6C" letter-spacing="2" text-anchor="end">OPTICAL GLASS 4K ENGINE</text>
  </g>
</svg>
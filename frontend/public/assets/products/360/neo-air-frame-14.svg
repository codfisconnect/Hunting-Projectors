<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette / Glow -->
    <radialGradient id="stageGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#141822" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0B0D12" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Graphite Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242833"/>
      <stop offset="25%" stop-color="#181B22"/>
      <stop offset="70%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#0C0E12"/>
    </linearGradient>

    <!-- Top Plate Anodized Aluminum -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A404F"/>
      <stop offset="10%" stop-color="#222631"/>
      <stop offset="90%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>

    <!-- Optical Lens Gradients -->
    <radialGradient id="lensGlass" cx="31.141807012330702%" cy="41.1731656763491%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#9DDCFF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#4C9EEB" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#061226" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Lens Specular Glint -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9DDCFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow / Ambient Occlusion -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="400" cy="300" r="320" fill="url(#stageGlow)"/>

  <!-- Optical Projection Beam (Subtle) -->
  
  <polygon points="212,290 292,290 707.6120467488713,200 707.6120467488713,380" fill="#9DDCFF" opacity="0.07"/>
  

  <!-- Contact Shadow beneath Projector -->
  <ellipse cx="400" cy="485" rx="235.3073372946036" ry="44.23879532511287" fill="url(#floorShadow)"/>

  <!-- Projector Main Chassis Group -->
  <g transform="translate(400, 300) skewY(-2.77163859753386)">
    
    <!-- Base Chassis Shadow Edge -->
    <rect x="-265" y="-160" width="530" height="340" rx="60" fill="#08090C" opacity="0.8"/>

    <!-- Main Chassis Body -->
    <rect x="-270" y="-170" width="540" height="340" rx="60" fill="url(#chassisGrad)" stroke="#2D323E" stroke-width="1.5"/>

    <!-- Top Bevel Highlight Edge -->
    <path d="M -210 -170 L 210 -170 Q 270 -170 270 -134" fill="none" stroke="#5A6376" stroke-width="1.5" opacity="0.8"/>

    <!-- Horizontal Acoustic Ventilation Grille -->
    <g opacity="0.45">
      
        <line x1="-230" y1="-110" x2="230" y2="-110" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-109" x2="230" y2="-109" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="-88" x2="230" y2="-88" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-87" x2="230" y2="-87" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="-66" x2="230" y2="-66" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-65" x2="230" y2="-65" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="-44" x2="230" y2="-44" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-43" x2="230" y2="-43" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="-22" x2="230" y2="-22" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="-21" x2="230" y2="-21" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="0" x2="230" y2="0" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="1" x2="230" y2="1" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="22" x2="230" y2="22" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="23" x2="230" y2="23" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
        <line x1="-230" y1="44" x2="230" y2="44" stroke="#0A0C10" stroke-width="3" stroke-linecap="round"/>
        <line x1="-230" y1="45" x2="230" y2="45" stroke="#333947" stroke-width="1" stroke-linecap="round"/>
      
    </g>

    <!-- Front Optical Lens Assembly (Only visible when facing toward front) -->
    
    <!-- Lens Outer Barrel Ring -->
    <g transform="translate(-148, 15)">
      <!-- Shadow behind lens housing -->
      <ellipse cx="0" cy="0" rx="39.10852784331512" ry="88" fill="#0A0B0E" opacity="0.9"/>
      
      <!-- Outer Machined Bezel with Knurled Texture -->
      <ellipse cx="0" cy="0" rx="37.3308674868008" ry="84" fill="#1A1C22" stroke="#485062" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="33.775546773772156" ry="76" fill="#101217" stroke="#222631" stroke-width="1.5"/>

      <!-- Precision Optical Glass Element -->
      <ellipse cx="0" cy="0" rx="30.220226060743506" ry="68" fill="url(#lensGlass)"/>

      <!-- Anti-Reflective Internal Coating Rings -->
      <ellipse cx="-2.222075445642905" cy="-5" rx="23.10958463468621" ry="52" fill="none" stroke="#9DDCFF" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="2.222075445642905" cy="6" rx="15.998943208628916" ry="36" fill="none" stroke="#4C9EEB" stroke-width="1.2" opacity="0.7"/>

      <!-- Specular Optical Reflection Arc -->
      <path d="M -17.77660356514324 -42 A 25.776075169457695 58 0 0 1 13.332452673857428 -48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-9.77713196082878" cy="-22" r="5" fill="#FFFFFF" opacity="0.9"/>

      <!-- ToF Laser Sensor Window -->
      <circle cx="31.10905623900067" cy="-35" r="7" fill="#0C0E14" stroke="#373D4D" stroke-width="1.5"/>
      <circle cx="31.10905623900067" cy="-35" r="3" fill="#9DDCFF" opacity="0.8"/>
    </g>
    

    <!-- Laser Etched Hunting Brand Emblem -->
    <g transform="translate(0, -95)" opacity="0.85">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#E2E5EB" letter-spacing="5" text-anchor="middle">HUNTING</text>
      <text x="0" y="14" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="600" fill="#757E90" letter-spacing="4" text-anchor="middle">PROJECTORS</text>
    </g>

    <!-- Status Indicator LED Strip -->
    <rect x="-35" y="156" width="70" height="2.5" rx="1" fill="#9DDCFF" opacity="0.85"/>

    <!-- Corner Anodized Fasteners -->
    <circle cx="-250" cy="-150" r="2.5" fill="#444B5B"/>
    <circle cx="250" cy="-150" r="2.5" fill="#444B5B"/>
    <circle cx="-250" cy="150" r="2.5" fill="#444B5B"/>
    <circle cx="250" cy="150" r="2.5" fill="#444B5B"/>

  </g>

  <!-- Technical Spec Metadata Stamp (Architectural & Premium) -->
  <g transform="translate(50, 560)">
    <text x="0" y="0" font-family="Inter, monospace" font-size="9" fill="#525B6C" letter-spacing="2">MODEL: HUNTING-NEO-AIR • DEGREE: 292.5°</text>
    <text x="700" y="0" font-family="Inter, monospace" font-size="9" fill="#525B6C" letter-spacing="2" text-anchor="end">OPTICAL GLASS 4K ENGINE</text>
  </g>
</svg>